# RELIC
 r_gdi_matrix:0 "G.D.I. War Matrix"
 r_gdi_matrix_desc:0 "A fragmented war matrix from a once menacing empire. We can invest a large amount of dark-matter to defragment the relic and gain access to the G.D.I crisis' secrets."
 r_gdi_matrix_active:0 "Allows us to choose between three extremely powerful bonuses to assist us in our endeavours as the Galactic Menace. Only one choice can ever be selected, and we can come back later to decide if one does not appeal to us at the moment."
 gdi_r_option_1:0 "We will conjure an impenetrable bastion."
 gdi_r_option_1_tooltip:0 "The Aetherophasic Engine will conjure a large storm in your area.\n§YThis storm removes visibility into the systems it affects§! and §Gremoves intel about you from other empires§!.\nIt also §Yprevents any ship from jump-driving§! into the systems within the storm.\n§RThis storm does not dissipate§!."
 gdi_r_option_2:0 "We will blot out the stars. All that will remain is our light."
 gdi_r_option_2_tooltip:0 "You will §Gimmediately gain a free Star Eater§!. Additional Star Eaters may now be constructed starting from Crisis Level 4.\n§G+10000§! £sr_dark_matter£ Dark Matter storage capacity."
 gdi_r_option_3:0 "We must convince the community that our cause is righteous."
 gdi_r_option_3_tooltip:0 "Upon reaching Crisis Level 5, §Gyou will not automatically be declared a crisis, nor will you be removed from the Galactic Community§!.\nThe Community will still be able to declare you a crisis, and others will still be able to manually declare war on you."
 gdi_r_option_4:0 "We must consider our options carefully, we will decide later."
 gdi_r_option_4_tooltip:0 "craft"
 gdi_buff_fail:0 "We have already selected a crisis buff"
 gdi_buff_success:0 "We have not already selected a crisis buff"